[package]
name = "cite"
version = "0.1.0-beta.0"
edition = "2024"
description = "Create, validate, build, and deploy podcast content to Supabase"
license = "MIT"
repository = "https://github.com/laezyAI/cite"
homepage = "https://github.com/laezyAI/cite"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
sha2 = "0.11"
percent-encoding = "2.3"
uuid = { version = "1.26", features = ["v4", "v5"] }
colored = "3.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = { version = "0.30.2", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libsql = { version = "0.10.0-pre.4", features = ["libsql-sys"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "isomp4", "aac", "alac", "pcm"] }
imagesize = "0.15"

[dev-dependencies]
tempfile = "3.27"
httpmock = "0.8"

[profile.dist]
inherits = "release"
lto = "thin"
